name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps

      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        # PRs only need chromium for the chromium-desktop project; pushes to
        # main run the full cross-browser matrix.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps chromium firefox webkit
          fi

      - name: Build app in mock mode
        run: npm run build
        env:
          NEXT_PUBLIC_STREAM_CONTRACT_ID_TESTNET: ''
          NEXT_PUBLIC_STREAM_CONTRACT_ID_MAINNET: ''

      - name: Run Playwright tests
        # Visual baselines are generated by the "Update Playwright Snapshots"
        # workflow (workflow_dispatch). Until they are committed, run the
        # functional e2e tests and skip screenshot assertions instead of
        # silently regenerating (and so never actually comparing) them.
        # PRs only run chromium-desktop for fast feedback; pushes to main
        # keep running the full browser/device project matrix.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PROJECT_ARGS="--project=chromium-desktop"
          else
            PROJECT_ARGS=""
          fi

          if find e2e/__screenshots__ -name '*.png' | grep -q .; then
            npx playwright test $PROJECT_ARGS
          else
            echo "::warning::No visual baselines committed; skipping screenshot assertions."
            npx playwright test --ignore-snapshots $PROJECT_ARGS
          fi
        env:
          NEXT_PUBLIC_STREAM_CONTRACT_ID_TESTNET: ''
          NEXT_PUBLIC_STREAM_CONTRACT_ID_MAINNET: ''

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build app in mock mode
        run: npm run build
        env:
          NEXT_PUBLIC_STREAM_CONTRACT_ID_TESTNET: ''
          NEXT_PUBLIC_STREAM_CONTRACT_ID_MAINNET: ''

      - name: Run Playwright tests
        # Visual baselines are generated by the "Update Playwright Snapshots"
        # workflow (workflow_dispatch). Until they are committed, run the
        # functional e2e tests and skip screenshot assertions instead of
        # silently regenerating (and so never actually comparing) them.
        run: |
          if find e2e/__screenshots__ -name '*.png' | grep -q .; then
            npx playwright test
          else
            echo "::warning::No visual baselines committed; skipping screenshot assertions."
            npx playwright test --ignore-snapshots
          fi
        env:
          NEXT_PUBLIC_STREAM_CONTRACT_ID_TESTNET: ''
          NEXT_PUBLIC_STREAM_CONTRACT_ID_MAINNET: ''

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowStar — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c1014;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        color: #9aa0a6;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        margin-top: 16px;
        padding: 10px 20px;
        border-radius: 999px;
        border: none;
        background: #f5f5f5;
        color: #0c1014;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        FlowStar can't reach the network right now. Reconnect to load live stream data — any
        page you've already visited is still available from cache.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
